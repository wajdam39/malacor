<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test GLB Mobile - MALACOR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    body { margin:0; background:#0A0F0D; color:#F4F6F5; font-family:sans-serif; }
    #mv { width:100vw; height:50vh; display:block; }
    #log { padding:16px; font-size:13px; white-space:pre-wrap; }
    .ok { color:#7CFC00; } .err { color:#ff6b6b; }
  </style>
</head>
<body>
  <model-viewer id="mv" src="modele/glb/clock.glb" camera-controls auto-rotate shadow-intensity="1" environment-image="neutral" style="width:100vw;height:50vh;background-color:#0A0F0D"></model-viewer>
  <div id="log">Ładowanie…</div>
  <script>
    const mv = document.getElementById('mv');
    const log = document.getElementById('log');
    mv.addEventListener('load', () => { log.innerHTML = '<span class="ok">LOADED OK (WebGL dziala)</span>'; });
    mv.addEventListener('error', (e) => { log.innerHTML = '<span class="err">ERROR: ' + (e.detail && (e.detail.type||e.detail.message) || e.message || JSON.stringify(e)) + '</span>'; });
    setTimeout(() => { if (log.textContent === 'Ładowanie…') log.innerHTML = '<span class="err">TIMEOUT - model nie zaladowal sie w 8s</span>'; }, 8000);
  </script>
</body>
</html>
