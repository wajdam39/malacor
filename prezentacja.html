<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prezentacja 3D - MALACOR</title>
  <style>
    :root { --bg:#0A0F0D; --text:#F4F6F5; --accent:#D4AF37; --muted:#D1D5DB; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; }
    #canvas-container { position:fixed; inset:0; }
    canvas { display:block; }
    .ui { position:fixed; z-index:10; pointer-events:none; }
    .topbar { top:0; left:0; right:0; padding:18px 24px; display:flex; justify-content:space-between; align-items:center; }
    .back { pointer-events:auto; color:var(--muted); text-decoration:none; font-size:14px; border:1px solid rgba(212,175,55,0.3); padding:8px 14px; border-radius:4px; background:rgba(18,26,22,0.6); transition:all .2s; }
    .back:hover { color:var(--accent); border-color:var(--accent); }
    .title { font-size:14px; letter-spacing:.2em; color:var(--accent); }
    .hint { bottom:24px; left:50%; transform:translateX(-50%); font-size:12px; color:var(--muted); letter-spacing:.15em; text-align:center; }
    .loader { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); transition:opacity .6s ease; }
    .loader.hidden { opacity:0; pointer-events:none; }
    .spinner { width:48px; height:48px; border:3px solid rgba(212,175,55,0.2); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loader p { margin-top:16px; font-size:12px; letter-spacing:.2em; color:var(--muted); }
    .specs { bottom:24px; right:24px; font-size:12px; color:var(--muted); text-align:right; line-height:1.6; }
    .specs b { color:var(--accent); font-weight:600; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="ui topbar">
    <a class="back" href="index.html">← Powrót</a>
    <div class="title">KOŁO ZĘBATE — PREZENTACJA 3D</div>
  </div>
  <div class="ui hint">Przeciągnij, aby obrócić · Scroll, aby przybliżyć · Najedź, aby podświetlić</div>
  <div class="ui specs">
    <b>Materiał:</b> stal / PLA+<br>
    <b>Obróbka:</b> frezowanie CNC<br>
    <b>Dokładność:</b> ±0.05 mm
  </div>
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>ŁADOWANIE MODELU 3D…</p>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const container = document.getElementById("canvas-container");
    const loaderEl = document.getElementById("loader");

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0A0F0D);
    scene.fog = new THREE.FogExp2(0x0A0F0D, 0.05);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 4.5);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const envScene = new RoomEnvironment();
    const envTexture = pmremGenerator.fromScene(envScene, 0.04).texture;
    scene.environment = envTexture;
    envScene.dispose();

    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
    keyLight.position.set(5, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 50;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xD4AF37, 1.3);
    rimLight.position.set(-6, 4, -6);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0x4a90d9, 0.7, 20);
    fillLight.position.set(0, -2, 3);
    scene.add(fillLight);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(3, 64),
      new THREE.ShadowMaterial({ opacity: 0.35 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.1;
    ground.receiveShadow = true;
    scene.add(ground);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 2;
    controls.maxDistance = 8;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.target.set(0, 0, 0);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.6, 0.4, 0.85
    );
    composer.addPass(bloomPass);

    let gear = null;
    let isHovered = false;
    let parallax = { x: 0, y: 0, tx: 0, ty: 0 };
    const targetScale = new THREE.Vector3(1, 1, 1);
    const sparkParticles = [];

    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      "modele/glb/kolo-zebate.glb",
      (gltf) => {
        gear = gltf.scene;
        const box = new THREE.Box3().setFromObject(gear);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const s = 2.0 / maxDim;
        gear.scale.setScalar(s);
        gear.position.sub(center.multiplyScalar(s));
        gear.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach((m) => { m.envMapIntensity = 1.2; m.needsUpdate = true; });
            }
          }
        });
        scene.add(gear);
        loaderEl.classList.add("hidden");
      },
      (xhr) => {
        const pct = xhr.total ? Math.round((xhr.loaded / xhr.total) * 100) : 0;
        loaderEl.querySelector("p").textContent = "ŁADOWANIE MODELU 3D… " + pct + "%";
      },
      (err) => {
        console.error("GLB load error:", err);
        loaderEl.querySelector("p").textContent = "BŁĄD ŁADOWANIA MODELU";
      }
    );

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDragging = false;
    renderer.domElement.addEventListener("pointerdown", () => { isDragging = true; controls.autoRotate = false; });
    renderer.domElement.addEventListener("pointerup", () => { isDragging = false; setTimeout(() => { controls.autoRotate = true; }, 1200); });

    renderer.domElement.addEventListener("pointermove", (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      parallax.tx = mouse.x * 0.35;
      parallax.ty = mouse.y * 0.25;
      if (gear) {
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObject(gear, true);
        const wasHovered = isHovered;
        isHovered = hits.length > 0;
        if (isHovered !== wasHovered) {
          targetScale.setScalar(isHovered ? 1.06 : 1.0);
          gear.traverse((c) => {
            if (c.isMesh && c.material) {
              const mats = Array.isArray(c.material) ? c.material : [c.material];
              mats.forEach((m) => {
                if (m.emissive) {
                  m.emissive.setHex(isHovered ? 0x3a2f10 : 0x000000);
                  m.emissiveIntensity = isHovered ? 0.25 : 0;
                }
              });
            }
          });
          rimLight.intensity = isHovered ? 2.0 : 1.3;
        }
      }
    });

    renderer.domElement.addEventListener("click", () => {
      if (!gear) return;
      const count = (window.innerWidth < 768) ? 15 : 40;
      const positions = new Float32Array(count * 3);
      const velocities = [];
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        positions[i*3] = 0; positions[i*3+1] = 0; positions[i*3+2] = 0;
        velocities.push(new THREE.Vector3(
          Math.sin(phi) * Math.cos(theta) * 0.05,
          Math.cos(phi) * 0.05,
          Math.sin(phi) * Math.sin(theta) * 0.05
        ));
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({ color: 0xD4AF37, size: 0.06, transparent: true, opacity: 1, depthWrite: false });
      const points = new THREE.Points(geo, mat);
      gear.getWorldPosition(points.position);
      scene.add(points);
      sparkParticles.push({ points, velocities, geo, mat, life: 0.8, age: 0 });
      bloomPass.strength = 1.6;
      setTimeout(() => { bloomPass.strength = 0.6; }, 300);
    });

    let scrollZoom = 0;
    renderer.domElement.addEventListener("wheel", (e) => {
      e.preventDefault();
      scrollZoom += e.deltaY * 0.002;
      scrollZoom = THREE.MathUtils.clamp(scrollZoom, -1.5, 1.5);
    }, { passive: false });

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener("resize", onResize);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (gear) {
        if (!isDragging) {
          parallax.x += (parallax.tx - parallax.x) * 0.08;
          parallax.y += (parallax.ty - parallax.y) * 0.08;
          gear.rotation.y += parallax.x * 0.02;
          gear.rotation.x += parallax.y * 0.02;
        }
        gear.scale.lerp(targetScale, 0.12);
        camera.position.z += (4.5 + scrollZoom * -1.2 - camera.position.z) * 0.1;
      }
      for (let i = sparkParticles.length - 1; i >= 0; i--) {
        const s = sparkParticles[i];
        s.age += dt;
        const t = s.age / s.life;
        if (t >= 1) {
          scene.remove(s.points); s.geo.dispose(); s.mat.dispose();
          sparkParticles.splice(i, 1); continue;
        }
        const pos = s.geo.attributes.position;
        for (let j = 0; j < s.velocities.length; j++) {
          pos.array[j*3] += s.velocities[j].x;
          pos.array[j*3+1] += s.velocities[j].y;
          pos.array[j*3+2] += s.velocities[j].z;
          s.velocities[j].multiplyScalar(0.96);
        }
        pos.needsUpdate = true;
        s.mat.opacity = 1 - t;
        s.mat.size = 0.06 * (1 - t * 0.5);
      }
      controls.update();
      composer.render();
    }
    animate();

    window.addEventListener("beforeunload", () => {
      renderer.dispose();
      pmremGenerator.dispose();
      composer.dispose();
    });

    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      controls.autoRotate = false;
      bloomPass.strength = 0.2;
    }
  </script>
</body>
</html>
