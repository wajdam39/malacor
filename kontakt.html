<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt - MALACOR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo-link"><img src="8a5bb98a-13e7-4903-bc98-6943410c3e53.jfif" alt="MALACOR" class="logo-img"><span class="logo-text">MALACOR</span></a>
      <details class="nav-details">
        <summary class="nav-toggle-label">☰ Menu</summary>
      <nav class="nav">
        <a href="index.html">Start</a>
        <a href="uslugi.html">Usługi inżynieryjne</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
      </details>
    </div>
  </header>
  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <div class="section-label">KONTAKT</div>
            <h2>Napisz do nas</h2>
          </div>
        </div>
        <form class="newsletter" onsubmit="return false;" style="max-width:480px;">
          <input type="text" placeholder="Imię i nazwisko" style="margin-bottom:8px;">
          <input type="email" placeholder="Twój adres e-mail" style="margin-bottom:8px;">
          <textarea placeholder="Wiadomość" style="width:100%;min-height:120px;margin-bottom:8px;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-2);color:var(--text);"></textarea>
          <button type="submit">Wyślij</button>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 MALACOR. WSZELKIE PRAWA ZASTRZEŻONE.</div>
      </div>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
